version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine dev-tool bumps instead of ten.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      framework:
        patterns: ["laravel/*", "symfony/*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on the 8.4 LTS line that CI tests against; innovation releases
      # would make local dev diverge from CI.
      - dependency-name: mysql
        update-types: [version-update:semver-major, version-update:semver-minor]
